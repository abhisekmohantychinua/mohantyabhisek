name: Documentation

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-main
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and Publish Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Generate TypeDoc first.
      - name: Generate TypeScript Documentation
        run: npx typedoc

      # Add the standalone RapiDoc page and OpenAPI specification.
      - name: Prepare RapiDoc
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out/api-docs

          cp docs/api-docs/index.html out/api-docs/index.html
          cp docs/api-docs/openapi.json out/api-docs/openapi.json

      # Preserve generated output outside the Git working tree.
      - name: Prepare Documentation Snapshot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/documentation-snapshot"

          cp -R out/. "$RUNNER_TEMP/documentation-snapshot/"

      # Publish the complete site to an independent branch.
      - name: Publish Documentation
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin documentation || true

          if git show-ref --verify --quiet refs/remotes/origin/documentation; then
            git checkout -B documentation origin/documentation --force
          else
            git checkout --orphan documentation
          fi

          # Clear all previously published files.
          git clean -fdx

          # Copy the complete documentation snapshot.
          cp -R "$RUNNER_TEMP/documentation-snapshot/." .

          git add --all

          if git diff --cached --quiet; then
            echo "Documentation is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "docs: update documentation for ${{ github.sha }}"

          git push origin documentation
